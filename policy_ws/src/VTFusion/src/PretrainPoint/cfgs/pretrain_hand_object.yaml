# 优化器配置（修正YAML格式，去掉JSON风格）
optimizer:
  type: AdamW
  kwargs:
    lr: 0.0005
    weight_decay: 0.05

# 调度器配置
scheduler:
  type: CosLR  # 需确保代码中有CosLR的实现，否则替换为PyTorch原生的CosineAnnealingLR
  kwargs:
    epochs: 300
    initial_epochs: 5

# 数据集配置（核心修正：缩进+语法）
dataset:
  data_dir: /home/lfg/data1/touch_dataset_3
  train_ratio: 0.8
  npoints: 1024  # 换行+正确缩进，确保train是dataset的子节点
  # 训练集配置（匹配代码：config.dataset.train.others.bs）
  train:
    others:
      bs: 32  # 单卡默认值，代码会按total_bs自动覆盖
  # 验证集配置（匹配代码：config.dataset.val.others.bs）
  val:
    others:
      bs: 32

# 模型配置（仅修正格式，参数保留你的设置）
model:
  NAME: PretrainPoint
  m: 0.999
  T: 0.07
  K: 16384
  pos_embed_hidden_dim: 128
  transformer_config:
    mask_ratio: [0.20, 0.75]
    trans_dim: 384
    depth: 12
    dec_depth: 1
    use_sigmoid: true
    use_moco_loss: true
    query_loss_weight: 1.0
    moco_loss_weight: 0.01
    use_focal_loss: true
    focal_loss_alpha: 0.25
    focal_loss_gamma: 2
    ambiguous_threshold: -1
    ambiguous_dynamic_threshold: 1000
    dec_query_mode: points  # [center, points]
    dec_query_real_num: 1000
    dec_query_fake_num: 7200
    drop_path_rate: 0.1
    cls_dim: 512
    num_heads: 6
    group_size: 32
    num_group: 64
    encoder_dims: 256

# 全局训练参数
total_bs: 16  
step_per_update: 1
grad_norm_clip: 10
max_epoch: 300