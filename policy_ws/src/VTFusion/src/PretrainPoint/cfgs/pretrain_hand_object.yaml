# Optimizer configuration (Fix YAML format, remove JSON style)
optimizer:
  type: AdamW
  kwargs:
    lr: 0.0005
    weight_decay: 0.05

# Scheduler configuration
scheduler:
  type: CosLR  
  kwargs:
    epochs: 300
    initial_epochs: 5

# Dataset configuration
dataset:
  data_dir: /policy_ws/src/VTFusion/hand_object_data/hand_object_dataset
  train_ratio: 0.8
  npoints: 1024  
  train:
    others:
      bs: 32  
  val:
    others:
      bs: 32

# Model configuration
model:
  NAME: PretrainPoint
  m: 0.999
  T: 0.07
  K: 16384
  pos_embed_hidden_dim: 128
  transformer_config:
    mask_ratio: [0.20, 0.75]
    trans_dim: 384
    depth: 12
    dec_depth: 1
    use_sigmoid: true
    use_moco_loss: true
    query_loss_weight: 1.0
    moco_loss_weight: 0.01
    use_focal_loss: true
    focal_loss_alpha: 0.25
    focal_loss_gamma: 2
    ambiguous_threshold: -1
    ambiguous_dynamic_threshold: 1000
    dec_query_mode: points  # [center, points]
    dec_query_real_num: 1000
    dec_query_fake_num: 7200
    drop_path_rate: 0.1
    cls_dim: 512
    num_heads: 6
    group_size: 32
    num_group: 64
    encoder_dims: 256

# Global training parameters
total_bs: 64  
step_per_update: 1
grad_norm_clip: 10
max_epoch: 500